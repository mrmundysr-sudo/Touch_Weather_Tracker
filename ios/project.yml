name: TouchWeatherTracker
options:
  bundleIdPrefix: com.mundymorning
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  TWCore:
    path: TWCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    majorVersion: 11.13.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    majorVersion: 2.7.0
targets:
  TouchWeatherTracker:
    type: application
    platform: iOS
    sources:
      - path: TouchWeatherTracker
    dependencies:
      - package: TWCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - target: TouchWeatherWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mundymorning.touchweathertracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: TouchWeatherTracker/Info.plist
      properties:
        CFBundleDisplayName: Touch Weather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: Touch Weather uses your location only when you tap "Use my location" to add your current place. It is not tracked in the background.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.mundymorning.touchweathertracker
            CFBundleURLSchemes: [touchweather]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.mundymorning.touchweathertracker.refresh]
        # AdMob: Google's published TEST application id. Replace with the owner's id before any release (docs/MONETIZATION.md).
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    entitlements:
      path: TouchWeatherTracker/TouchWeatherTracker.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mundymorning.touchweathertracker]
  TouchWeatherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TouchWeatherWidgets
    dependencies:
      - package: TWCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mundymorning.touchweathertracker.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
    info:
      path: TouchWeatherWidgets/Info.plist
      properties:
        CFBundleDisplayName: Touch Weather Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TouchWeatherWidgets/TouchWeatherWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mundymorning.touchweathertracker]
schemes:
  TouchWeatherTracker:
    build:
      targets:
        TouchWeatherTracker: all
    run:
      config: Debug
